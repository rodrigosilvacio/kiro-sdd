<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página não encontrada | Curso de SDD</title>
  <style>
    body { margin: 0; padding: 2rem 1rem; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: #1a1d21; background: #ffffff; line-height: 1.5; }
    main { max-width: 40rem; margin: 0 auto; }
    a { color: #0b4f9c; }
    a:focus-visible { outline: 3px solid #0b4f9c; outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <h1>Página não encontrada</h1>
    <p>O endereço que você abriu não existe neste curso.</p>
    <p><a id="inicio" href="index.html">Voltar para a página inicial</a></p>
  </main>
  <script>
    (function () {
      // Recalcula o href relativo pela profundidade da URL após /kiro-sdd/ (sem diferenciar maiúsculas).
      var caminho = location.pathname, marca = '/kiro-sdd/', i = caminho.toLowerCase().indexOf(marca);
      if (i < 0) return;
      var resto = caminho.slice(i + marca.length), partes = resto.split('/');
      var profundidade = Math.max(partes.length - 1, 0);
      var prefixo = '';
      for (var n = 0; n < profundidade; n++) prefixo += '../';
      document.getElementById('inicio').setAttribute('href', prefixo + 'index.html');
    })();
  </script>
</body>
</html>
